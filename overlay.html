<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline';"
    />
    <title>DeskPods Overlay</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      #tooltip {
        position: fixed;
        left: 0;
        top: 0;
        max-width: 260px;
        padding: 6px 10px;
        border-radius: 8px;
        background: #1e293b;
        color: #f8fafc;
        font-size: 13px;
        font-weight: 500;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        box-shadow:
          0 4px 16px rgba(0, 0, 0, 0.45),
          0 0 0 1px #334155;
        transform: translateY(-50%) translateX(-4px);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 120ms ease,
          transform 120ms ease;
      }

      #tooltip.visible {
        opacity: 1;
        transform: translateY(-50%) translateX(0);
      }

      /* Little arrow pointing left toward the sidebar icon. */
      #tooltip::before {
        content: "";
        position: absolute;
        left: -4px;
        top: 50%;
        width: 8px;
        height: 8px;
        background: #1e293b;
        transform: translateY(-50%) rotate(45deg);
        border-radius: 1px;
      }

      /* Zoom level, flashed centre-top while the user zooms a Pod. */
      #zoom {
        position: fixed;
        top: 14px;
        left: 50%;
        padding: 7px 14px;
        border-radius: 999px;
        background: #1e293b;
        color: #f8fafc;
        font-size: 13px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        white-space: nowrap;
        box-shadow:
          0 4px 16px rgba(0, 0, 0, 0.45),
          0 0 0 1px #334155;
        transform: translateX(-50%) translateY(-8px);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 120ms ease,
          transform 120ms ease;
      }

      #zoom.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* Themed notification toasts, stacked top-right above the Pods. */
      #toasts {
        position: fixed;
        top: 12px;
        right: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 320px;
        pointer-events: none;
      }

      .toast {
        box-sizing: border-box;
        width: 100%;
        /* Clickable: a click dismisses it. Main only lets mouse events reach
           the overlay while the cursor is actually over one of these. */
        pointer-events: auto;
        cursor: pointer;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #334155;
        border-left: 3px solid #2563eb; /* accent */
        background: #1e293b; /* surface */
        color: #f8fafc;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        opacity: 0;
        transform: translateX(16px);
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }

      .toast.visible {
        opacity: 1;
        transform: translateX(0);
      }

      .toast:hover {
        border-color: #475569;
      }

      /* On the way out it must stop swallowing clicks. */
      .toast.leaving {
        pointer-events: none;
      }

      .toast .pod {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #94a3b8; /* muted */
        margin-bottom: 2px;
      }

      .toast .title {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .toast .body {
        font-size: 12px;
        line-height: 1.3;
        color: #cbd5e1;
        margin-top: 3px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="tooltip"></div>
    <div id="zoom"></div>
    <div id="toasts"></div>
    <script type="module" src="/src/overlay/index.ts"></script>
  </body>
</html>
